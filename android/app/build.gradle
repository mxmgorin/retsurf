apply plugin: 'com.android.application'

// Cargo.toml is the single source of truth for the version, so the APK can't drift
// from the crate (the in-app updater compares the crate version, not this file).
def crateVersion = {
    def toml = new File(rootDir, "../Cargo.toml").getText("UTF-8")
    def matcher = (toml =~ /(?m)^version = "([^"]+)"/)
    if (!matcher) throw new GradleException("no package version found in ../Cargo.toml")
    return matcher[0][1]
}()

// Strides pack semver into a monotonically increasing versionCode, each bounding
// the place below it (minor < 100, patch < 100).
def MINOR_STRIDE = 100
def MAJOR_STRIDE = 10000
def (verMajor, verMinor, verPatch) = crateVersion.split('-')[0].tokenize('.').collect { it.toInteger() }

android {
    namespace 'com.retsurf'
    compileSdk 34

    defaultConfig {
        applicationId "com.retsurf"
        minSdk 29              // Android 10: reliable JIT exec mappings + GLES 3.x
        targetSdk 34
        versionCode verMajor * MAJOR_STRIDE + verMinor * MINOR_STRIDE + verPatch
        versionName crateVersion
        // We ship a single 64-bit ABI. The Rust cdylib + libSDL2.so + libc++_shared.so
        // are built/placed under src/main/jniLibs/arm64-v8a by cargo-ndk and the
        // SDL-bundling step (see docs/ANDROID_PORT.md); there is NO Gradle-driven
        // native build here.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // CI generates a debug keystore and assembles release signed with it (the
    // artifact is for sideloading/handhelds, not Play). Replace with a real
    // upload key for store distribution. See docs/ANDROID_PORT.md.
    signingConfigs {
        release {
            storeFile file(System.getenv("RETSURF_KEYSTORE") ?: "debug.keystore")
            storePassword System.getenv("RETSURF_KEYSTORE_PASS") ?: "android"
            keyAlias System.getenv("RETSURF_KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("RETSURF_KEY_PASS") ?: "android"
        }
    }

    buildTypes {
        // Sign debug with the SAME keystore as release. AGP otherwise signs debug
        // with its own ~/.android/debug.keystore, whose key differs from release's
        // app/debug.keystore — a signature mismatch that makes `adb install -r`
        // fail (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and forces an uninstall every
        // time you switch profiles. One key = installs update in place.
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    lint {
        abortOnError false
    }
}

// No app dependencies: the SDL Java glue is compiled from src/main/java/org/libsdl/app.
dependencies {}
