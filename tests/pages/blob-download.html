<!doctype html>
<meta charset="utf-8">
<title>JS download trigger paths</title>
<!--
  How a "download" button actually reaches the engine. Sites fetch the bytes with
  JS and hand them over via a blob URL, a data: URL, or a plain link with the
  `download` attribute (which Servo ignores: htmlanchorelement.rs "TODO: Download
  the link if `download` attribute is set"). Each button below exercises one path
  the injected capture shim (src/browser/blob_download.js) must intercept.
  Beacons go to tests/serve.py, so a headless run is readable.
-->
<style>
  body { font: 15px sans-serif; margin: 1.5rem; }
  button { display: block; margin: .4rem 0; font-size: 1rem; padding: .5rem 1rem; }
  #log { font: 13px monospace; white-space: pre; margin-top: 1rem; }
</style>

<h1>JS download trigger paths</h1>
<button id="keep">1. blob anchor + download, keep the URL alive</button>
<button id="revoke">2. blob anchor + download, revoke right after click</button>
<button id="open">3. window.open(blobUrl)</button>
<button id="early">4. blob created at page load (before shim arms at Complete)</button>
<button id="http">5. http anchor + download attribute (no listed extension)</button>
<button id="data">6. data: anchor + download attribute</button>
<button id="data-plain">7. data: anchor, octet-stream, no attribute</button>
<button id="data-open">8. window.open(data:)</button>
<div id="log">ready</div>

<script>
  const out = document.getElementById("log");
  const say = (line) => {
    out.textContent = line;
    fetch("/report?tag=blob&" + line.replace(/ /g, "&")).catch(() => {});
  };

  // A tiny payload; the bytes don't matter, only how the URL is consumed.
  function blobUrl() {
    return URL.createObjectURL(new Blob([new Uint8Array([1, 2, 3, 4])],
      { type: "application/octet-stream" }));
  }

  // Created while the document parses: the shim must already be tracking
  // createObjectURL for case 4 to work.
  const earlyUrl = blobUrl();

  const DATA_URL = "data:application/octet-stream;base64,AQIDBA==";

  function clickAnchor(url, revoke, name) {
    const a = document.createElement("a");
    a.href = url;
    if (name !== null) a.setAttribute("download", name);
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Sites revoke immediately, assuming the download already took the bytes.
    if (revoke) URL.revokeObjectURL(url);
  }

  document.getElementById("keep").onclick = () => {
    const url = blobUrl();
    say("case=keep url=" + url.slice(0, 48));
    clickAnchor(url, false, "test-file.bin");
  };

  document.getElementById("revoke").onclick = () => {
    const url = blobUrl();
    say("case=revoke url=" + url.slice(0, 48));
    clickAnchor(url, true, "test-file.bin");
  };

  document.getElementById("open").onclick = () => {
    const url = blobUrl();
    say("case=open url=" + url.slice(0, 48));
    window.open(url);
  };

  document.getElementById("early").onclick = () => {
    say("case=early url=" + earlyUrl.slice(0, 48));
    clickAnchor(earlyUrl, false, "early-file.bin");
  };

  document.getElementById("http").onclick = () => {
    say("case=http");
    clickAnchor("/ua.html", false, "from-attr.html");
  };

  document.getElementById("data").onclick = () => {
    say("case=data");
    clickAnchor(DATA_URL, false, "data-file.bin");
  };

  document.getElementById("data-plain").onclick = () => {
    say("case=data-plain");
    clickAnchor(DATA_URL, false, null);
  };

  document.getElementById("data-open").onclick = () => {
    say("case=data-open");
    window.open(DATA_URL);
  };
</script>
