[package]
name = "retsurf"
version = "0.7.0"
edition = "2021"
license = "GPL-3.0"

# The Android `libretsurf.so` is built from `android/lib`, not from a second
# crate-type here: the armhf build compiles non-PIC (see tools/armhf/build.sh) and
# cannot link a shared object at all.
[workspace]
members = ["android/lib"]

[lib]
name = "retsurf"
crate-type = ["lib"]

[features]
default = ["webgl"]
# WebGL/WebGPU via a surfman connection. Off for the handheld build: surfman can't
# initialize on the EGL 1.4 Mali blobs (Knulli/muOS/ROCKNIX). See
# `src/platform/render.rs::create_surfman_connection`.
#
# `servo/webgl` is what compiles the WebGL thread and the script-side API into the
# engine; without it the handheld build drops both instead of shipping a WebGL that
# can never get a connection.
webgl = ["servo/webgl"]
sdl2-bundled = ["sdl2/bundled"]
sdl2-static-link = ["sdl2/static-link"]

# Fat LTO and codegen-units = 1 are CI-only, set via CARGO_PROFILE_RELEASE_* in
# .github/workflows/*, so local `cargo build --release` stays fast.
#
# `panic = "abort"` must stay out of here: it makes `catch_unwind` inert and breaks the
# surfman EGL-1.4 probe (`src/platform/render.rs`). Only the webgl-off handheld CI build
# sets it, where there is no probe.
[profile.release]
# `strip` is for local and Android builds, which have no strip step of their own and
# would otherwise ship symbols. The other two are release defaults, pinned so every
# build matches.
strip = true
debug-assertions = false
overflow-checks = false

[dependencies]
rust-embed="8.7.2"
rustls = {version = "0.23.32", features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
sdl2 = { version = "0.38.0", default-features = false }
gleam = "0.15"
glow = "0.17"
surfman = "0.13"
log = "0.4.28"
env_logger = "0.11.8"
# Named straight off the fork: no 0.5 exists on crates.io, so a version requirement
# plus `[patch.crates-io]` reads as unresolvable to tools like deps.rs.
#
# bundled_freetype: a Servo default lost to default-features = false. Without it
# freetype-sys wants a system FreeType newer than Ubuntu 22.04 (CI) ships.
#
# webcrypto: gates all of `window.crypto`, `getRandomValues` included, so scripts
# that never touch SubtleCrypto still break without it. On for every build.
servo = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a", default-features = false, features = ["bundled_freetype", "clipboard", "js_jit", "webcrypto"] }
# Servo hands us its memory report (profile_traits::mem::MemoryReportResult) through
# servo_base's GenericCallback. Same version as `servo`, so Cargo unifies on one copy.
servo-base = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
# WebAudio (src/media): our own servo-media backend renders the audio graph to an SDL2
# device instead of Servo's silent dummy, which still supplies the no-op Player/WebRTC
# types. Must resolve to the fork like `servo` does, or the backend registers into a
# second copy of these crates.
servo-media = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
servo-media-dummy = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
# `decodeAudioData` (src/media/decoder.rs). Pure Rust, so it cross-compiles to the
# handhelds; the enabled containers/codecs are what pages actually hand us. `opt-simd` is
# left off: it pulls rustfft in for a decode that runs once per file, off the render thread.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis", "aac", "isomp4", "id3v2"] }
# Files come at their own rate, `AudioBuffer` wants the context's. Polynomial resampling
# (no `fft_resampler`, so no FFT crates) is rubato's cheap end, which beats transition-band
# purity on an A35.
rubato = { version = "5", default-features = false }
# `<video>` decode (src/media/video.rs): Cisco's OpenH264 built from source via cc — the
# one C dependency, chosen because it cross-compiles with a plain toolchain (NEON asm
# included) where dav1d/libvpx want meson/configure. Software-only; a handheld may not
# hold real time, which is why [video] has its own switch.
openh264 = "0.9.8"
# Decoded YUV 420 -> the BGRA8 WebRender wants. SIMD paths (NEON/SSE) are its default
# features; the conversion runs once per displayed frame.
yuv = "0.8"
euclid = "0.22"
dpi = "0.1.2"
url = "2.5.7"
percent-encoding = "2.3"
# Matches the version servo-embedder-traits uses, so HeaderMap/StatusCode values
# we build for intercepted responses (the built-in start page) are the same type.
http = "1"
# Downloads are the embedder's job: Servo has no download API, still true on `main`.
# ureq is blocking (one thread per download) and bundles webpki roots, so TLS works
# on handhelds without a system CA store.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Ad blocking: Brave's engine (EasyList syntax), driven from Servo's
# load_web_resource hook. content-security-policy is already in Servo's tree —
# we only need its Destination enum to classify intercepted requests.
adblock = "0.13"
content-security-policy = "0.8"
keyboard-types = "0.8.1"
# Rebindable input: the gesture machine (tap/hold/chord), `bindings.toml`, gesture
# capture and the editor model. Not on crates.io, so it is pinned by rev like the
# Servo fork. Its `sdl2` feature is the default and resolves to the same sdl2 as
# ours, so the pad and key types are one set.
inputbind = { git = "https://github.com/mxmgorin/inputbind", rev = "523a8055575e01adee345bc16f8ed42c20014781" }
egui-sdl2 = { version = "0.11.0", default-features = false, features = ["glow-backend"] }
# Every chrome icon comes from this font (see `src/ui/theme.rs`). `bold` is the base
# weight — the lighter ones wash out at the 15px icons the handhelds draw — and `fill`
# supplies the solid halves of on/off pairs. Version tracks egui: 0.14 = egui 0.36.
#
# From the fork by rev: upstream's newest release is still on egui 0.35, and a second
# egui in the graph would make `add_to_fonts` take a `FontDefinitions` we can't hand it.
egui-phosphor = { git = "https://github.com/mxmgorin/egui-phosphor", rev = "2450b628806faca64859caae129972852216c2b1", default-features = false, features = ["bold", "fill"] }
sdl2-keyboard-types = "0.1.0"
# Decodes the bundled window-icon PNG at startup for SDL's set_icon. Pinned to the
# version already in the tree (pulled in via servo), so it adds no new resolve.
png = "0.18"
# Decoding files a page hands us as base64 over `evaluate_javascript`
# (src/browser/blob_download.rs). Already in the tree via servo.
base64 = "0.23"

# In-app self-update (PortMaster only; see src/update). serde_json/sha2/semver are already
# in the tree via servo; serde_json also parses blob-capture payloads
# (src/browser/blob_download.rs). `zip` is the one new crate: deflate is what the release
# artifact uses, and its flate2 backend keeps the ARM cross-builds free of C.
serde_json = "1"
sha2 = "0.11"
semver = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Android: SDL loads our cdylib and calls the C `SDL_main` we export. Logs go to
# logcat via android_logger since there is no stderr to mirror to a file.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# The engine comes from our Servo fork: `retsurf-main-0.5` is upstream `main` plus
# the two fixes in `patches/`, with `retsurf-0.5` (the released line) as the
# fallback. See docs/SERVO_PATCH.md.
#
# Every entry must name one source: the Servo crates depend on each other by path,
# so a mixed graph ends up with two of every crate. Pin a `rev`, never a branch —
# the branch is rebased onto upstream, so each rev needs its `retsurf-main-<version>`
# tag to stay reachable.
#
# Only catches transitive crates-io references now; a rev bump moves both lists.
[patch.crates-io]
servo = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
servo-base = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
servo-media = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
servo-media-dummy = { git = "https://github.com/mxmgorin/servo", rev = "8e6b2b879910c50d5be6845912c27ff84e44775a" }
