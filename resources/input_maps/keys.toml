# The retro convention: arrows to move, Z to confirm or jump, X to cancel or
# attack, as RPG Maker and most jam games read them. Copy this into
# <data dir>/input_maps/keys.toml to change it; deleting that copy restores this one.
name = "Keyboard (arrows and Z/X)"

[pad]
up = "key.ArrowUp"
down = "key.ArrowDown"
left = "key.ArrowLeft"
right = "key.ArrowRight"
a = "key.z"
b = "key.x"
x = "key.c"
y = "key.Space"
l1 = "key.q"
r1 = "key.e"
start = "key.Enter"
select = "key.Escape"
l2 = "mouse.right"
r2 = "mouse.left"

[stick.left]
up = "key.ArrowUp"
down = "key.ArrowDown"
left = "key.ArrowLeft"
right = "key.ArrowRight"

[stick.right]
analog = "mouse.cursor"
