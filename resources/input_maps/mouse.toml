# After Steam Input's "Mouse Only" template, with the cursor on the left stick so a
# one-stick handheld can point. Copy this into <data dir>/input_maps/mouse.toml
# to change it; deleting that copy restores this one.
name = "Mouse only"

[pad]
a = "mouse.left"
b = "key.Escape"
x = "mouse.right"
l2 = "mouse.right"
r2 = "mouse.left"
start = "key.Enter"
select = "key.Escape"
l1 = "mouse.scroll.down"
r1 = "mouse.scroll.up"

[stick.left]
analog = "mouse.cursor"

[stick.right]
analog = "mouse.scroll"
