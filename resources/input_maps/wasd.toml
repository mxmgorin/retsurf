# After Steam Input's "Keyboard (WASD) and Mouse" template, with the right stick
# as the trackpad. Copy this into <data dir>/input_maps/wasd.toml to change it;
# deleting that copy restores this one.
name = "Keyboard (WASD)"

[pad]
a = "key.Space"
b = "key.e"
x = "key.r"
y = "key.f"
# The hotbar, clockwise from the top.
up = "key.1"
right = "key.2"
down = "key.3"
left = "key.4"
l1 = "mouse.scroll.down"
r1 = "mouse.scroll.up"
l2 = "mouse.right"
r2 = "mouse.left"
# Shift's key and code differ; a game reading `e.code` needs the code.
l3 = { to = "key.Shift", code = "ShiftLeft" }
start = "key.Enter"
select = "key.Escape"

[stick.left]
up = "key.w"
down = "key.s"
left = "key.a"
right = "key.d"

[stick.right]
analog = "mouse.cursor"
