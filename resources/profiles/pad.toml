# The pad reaches the page raw, for games that read the Gamepad API themselves.
# Only the right stick and R2 are spent, on the pointer path that is the one
# measured on hardware; everything else is the game's, untouched. Copy this into
# <data dir>/profiles/pad.toml to change it; deleting that copy restores this.
name = "Gamepad passthrough"

[pad]
r2 = "mouse.left"

[stick.right]
analog = "mouse.cursor"
