name: Linux build environment
description: >
  Servo's build dependencies, the pinned toolchain and the cargo-home cache — the
  setup the check job and the Linux build job would otherwise both spell out.
  Cargo home only: a Servo target/ would blow the 10 GB cache budget. Meant to run
  after actions/checkout.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eux
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential clang libclang-14-dev cmake curl git gperf pkg-config \
          python3 python3-pip ca-certificates \
          libssl-dev libdbus-1-dev libfreetype6-dev libglib2.0-dev \
          libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
          libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev \
          libsdl2-dev zip

    - shell: bash
      run: |
        set -eux
        # rust-toolchain.toml pins the channel; rustup (preinstalled) honors it.
        rustup show
        rustc --version

    # The engine is a git dependency (our Servo fork), so a cold runner clones
    # ~1.7 GB before it can resolve. `shared-key` shares one entry per OS.
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false
        shared-key: cargo-home
