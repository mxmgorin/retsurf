name: Check

# The signal every push gets: does it build, do the tests and the pages pass, is
# clippy clean. Not the shipping build — no fat LTO, no packaging, no artifact.
# Binaries come from Nightly and from releases, so nothing here has a consumer.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 22.04 over latest to match the shipping build's glibc, so a link error
    # shows up here rather than at release time.
    runs-on: ubuntu-22.04
    env:
      # clang-sys would take the newest libclang on this image, and mozangle's
      # shader bindgen dies on clang 15: it dropped __builtin_ia32_* sat-math.
      LIBCLANG_PATH: /usr/lib/llvm-14/lib
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/linux-build-env

      # One profile for all three steps: a profile switch would compile Servo a
      # second time. Release without the LTO knobs the Nightly build sets.
      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      # Only workspace crates go through clippy-driver (RUSTC_WORKSPACE_WRAPPER),
      # so the dependencies stay as the build left them.
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # The only step that runs a browser: layout, media, WebGL, input and the
      # download triggers, through the pages' own beacons. Software GL: no GPU here.
      - name: Pages
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool ffmpeg libgl1-mesa-dri
          python3 tests/run_pages.py --binary target/release/retsurf

      - name: Upload page logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: page-logs
          path: /tmp/retsurf-pages
          retention-days: 7
