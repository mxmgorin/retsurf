name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - resources/images/**
      - resources/retsurf.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The page shares its images with the README, so they are copied in rather than duplicated.
      - name: Assemble
        run: |
          mkdir -p _site/images
          cp -r site/. _site/
          cp resources/retsurf.svg _site/
          cp resources/images/*.png resources/images/*.jpg _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
