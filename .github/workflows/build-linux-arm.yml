name: Linux ARM

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  release:
    types: [published]

# Only pushes supersede each other: a second push to main cancels the build the
# first one started. Release and manual runs get their own group (the ref differs)
# and never cancel, so a release can't lose its artifacts to a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  # The oldest userland we target, ArkOS. Kept in step with
  # tools/arm64/glibc-floor.
  GLIBC_FLOOR: "2.30"

jobs:
  build-arm:
    # Native arm64 runner (free for public repos) — no cross-compile, no qemu.
    # One job per target core; they run in parallel on separate runners, so the
    # 3× Servo compile is ~1× wall-clock. A pure codegen flag (RUSTFLAGS) — the
    # Graviton runner happily emits code for older cores it doesn't itself run.
    runs-on: ubuntu-22.04-arm
    # A binary requires whatever glibc it links against, and the runner's is
    # 2.35; focal's 2.31 keeps it on the floor above. Native on an arm64 runner.
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARMv8.0-A, in-order. RK3326. Runs on A53 too (same ISA).
          - cpu: cortex-a35
            suffix: a35
          # ARMv8.0-A, in-order, crypto OFF (optional on A53; H700/A133 may lack
          # it). Safe v8.0 baseline + default fallback. H700, Allwinner A133 Plus.
          - cpu: cortex-a53
            suffix: a53
          # ARMv8.2-A: LSE atomics, fp16, dotprod + crypto (present on these
          # chips). SIGILLs on the v8.0 cores above — must stay a separate binary.
          # RK3566, Allwinner A523 (T527 family).
          - cpu: cortex-a55
            suffix: a55
    steps:
      # actions/checkout needs a git the container does not ship. safe.directory:
      # the workspace belongs to the runner's user, and build.rs reads it.
      - name: Bootstrap the container
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      # Gates the `package` job too (it needs build-arm), so a mismatched release
      # never produces the PortMaster zip either.
      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'release'
        uses: ./.github/actions/verify-version

      - name: Diagnostics
        run: |
          set -eux
          uname -m
          ldd --version | head -1
          nproc
          free -h || true
          df -h /

      - name: Build environment
        uses: ./.github/actions/arm-build-env

      # The engine is a git dependency (our Servo fork), so a cold runner clones
      # ~1.7 GB before it can resolve. Cargo home only: a Servo release target/
      # would blow the 10 GB cache budget. `shared-key` shares one entry per OS.
      - name: Cache cargo home
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: cargo-home

      - name: Build
        env:
          # Static libstdc++: the devices at the floor carry a GCC-9 C++ runtime.
          # /opt/cxx-static covers cc-rs's own `-lstdc++`, which the flag does not.
          RUSTFLAGS: >-
            -C target-cpu=${{ matrix.cpu }}
            -C link-arg=-L/opt/cxx-static
            -C link-arg=-static-libstdc++
          CC: gcc-10
          CXX: g++-10
          # bindgen: focal's own clang is 10 and mozjs_sys 153 needs 19.
          LIBCLANG_PATH: /usr/lib/llvm-19/lib
          CLANG_PATH: /usr/bin/clang-19
          # SpiderMonkey's configure gives up if there is no llvm-objdump beside
          # the clang it found, and the compiler here is GCC.
          LLVM_OBJDUMP: /usr/lib/llvm-19/bin/llvm-objdump
          # Unset, mozjs_sys downloads a prebuilt SpiderMonkey built on Ubuntu
          # 22.04: symbols above the floor, and a libstdc++ 11 GCC 10 cannot answer.
          MOZJS_FROM_SOURCE: "1"
          # CI performance build (kept out of Cargo.toml so local `cargo build
          # --release` stays fast): whole-program fat LTO across the huge Servo
          # graph + a single codegen unit.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          # panic=abort: webgl is off here (--no-default-features) so the only
          # catch_unwind in our code (the surfman probe) is gone — drop unwind
          # tables for a smaller, tighter binary. Trade-off: a panic in a Servo
          # worker/layout thread now aborts the process instead of unwinding it;
          # the RETSURF_PANIC_FILE hook (src/lib.rs) still runs first, so it's
          # logged. Desktop/Android keep unwind (webgl on → probe is compiled).
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: |
          set -eux
          # --no-default-features drops `webgl`: surfman can't init on EGL 1.4 Mali
          # blobs and the connection is unused there, so the probe is skipped entirely
          # and `servo/webgl` leaves the engine's WebGL thread out of the binary.
          cargo build --release --no-default-features
          df -h /

      # Above the floor the device's loader refuses the binary, so fail here
      # instead of in a bug report.
      - name: Check the glibc floor
        run: |
          set -eux
          readelf -d target/release/retsurf | grep NEEDED
          readelf -V target/release/retsurf | grep -o 'GLIBC_2\.[0-9]*' | sort -uV
          newer=$(readelf -V target/release/retsurf \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV \
            | awk -F. -v f="${GLIBC_FLOOR#2.}" '$2 > f' | tr '\n' ' ')
          if [ -n "$newer" ]; then
            echo "binary requires $newer; the floor is GLIBC_$GLIBC_FLOOR" >&2
            exit 1
          fi
          # The C++ runtime carries no GLIBC_ version for the check above to catch.
          if readelf -d target/release/retsurf | grep -q 'NEEDED.*libstdc++'; then
            echo "binary links libstdc++ dynamically; it has to be static here" >&2
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsurf "dist/retsurf.${{ matrix.suffix }}"
          strip "dist/retsurf.${{ matrix.suffix }}" || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-${{ matrix.suffix }}
          path: dist/retsurf.${{ matrix.suffix }}
          retention-days: 1

  package:
    # Collect all three per-core binaries into one PortMaster port; Retsurf.sh
    # picks the right one at runtime from /proc/cpuinfo.
    needs: build-arm
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download per-core binaries
        uses: actions/download-artifact@v4
        with:
          pattern: retsurf-a*
          path: bins
          merge-multiple: true

      - name: Package for PortMaster
        run: |
          set -eux
          pm=portmaster-dist
          rm -rf "$pm"
          mkdir -p "$pm/retsurf"
          # Only the launcher sits at the port root (installs to
          # /roms/ports/Retsurf.sh). Everything else lives in the retsurf/ gamedir
          # (/roms/ports/retsurf/), matching how installed ports lay out: port.json
          # + gameinfo.xml + README + screenshot + licenses next to the binaries.
          # port.json's bare "screenshot.png" and gameinfo's "./retsurf/screenshot.png"
          # (written relative to the merged system gamelist) both resolve there.
          cp portmaster/Retsurf.sh "$pm/"
          cp portmaster/port.json "$pm/retsurf/"
          cp portmaster/gameinfo.xml "$pm/retsurf/"
          cp portmaster/README.md "$pm/retsurf/"
          cp portmaster/screenshot.png "$pm/retsurf/"
          # Bring over any bundled gamedir assets (licenses/), minus .gitkeep.
          cp -r portmaster/retsurf/. "$pm/retsurf/"
          rm -f "$pm/retsurf/.gitkeep"
          # All three optimized variants; Retsurf.sh execs the matching one.
          cp bins/retsurf.a35 bins/retsurf.a53 bins/retsurf.a55 "$pm/retsurf/"
          chmod +x "$pm/Retsurf.sh" "$pm/retsurf/retsurf.a35" \
            "$pm/retsurf/retsurf.a53" "$pm/retsurf/retsurf.a55"
          ls -laR "$pm"

      - name: Upload PortMaster artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-portmaster
          path: portmaster-dist
          retention-days: 14

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          cd portmaster-dist && zip -r ../retsurf-portmaster.zip .
          cd ..
          # Checksum sidecar the in-app updater verifies against (src/update). Format
          # is `<hex>  <filename>`; the updater takes the first field.
          sha256sum retsurf-portmaster.zip > retsurf-portmaster.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsurf-portmaster.zip
            retsurf-portmaster.zip.sha256

  build-universal:
    # A single generic aarch64 binary for non-PortMaster installs: no -C
    # target-cpu (runs on any ARMv8.0+ core), default features (webgl ON, like
    # the desktop builds — the surfman probe falls back gracefully on EGL 1.4),
    # so panic stays `unwind` (the probe needs catch_unwind). Still a CI
    # performance build (fat LTO + one codegen unit). A dedicated build, not the
    # a53 reuse, so it isn't tied to any specific core's tuning. Independent of
    # the per-core matrix above, so it runs in parallel.
    runs-on: ubuntu-22.04-arm
    # Same floor as the per-core builds; a manual install lands on the same
    # firmwares.
    container: ubuntu:20.04
    steps:
      - name: Bootstrap the container
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'release'
        uses: ./.github/actions/verify-version

      - name: Build environment
        uses: ./.github/actions/arm-build-env

      - name: Build
        env:
          # Static libstdc++, for the same reason as the per-core builds above.
          RUSTFLAGS: >-
            -C link-arg=-L/opt/cxx-static
            -C link-arg=-static-libstdc++
          CC: gcc-10
          CXX: g++-10
          LIBCLANG_PATH: /usr/lib/llvm-19/lib
          CLANG_PATH: /usr/bin/clang-19
          LLVM_OBJDUMP: /usr/lib/llvm-19/bin/llvm-objdump
          # The prebuilt SpiderMonkey is an Ubuntu 22.04 build; see above.
          MOZJS_FROM_SOURCE: "1"
          # CI performance build; no target-cpu so the binary runs on any aarch64.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          set -eux
          # Default features (webgl ON) + panic=unwind (the default), so the
          # surfman probe's catch_unwind works on EGL 1.4 devices.
          cargo build --release
          df -h /

      - name: Check the glibc floor
        run: |
          set -eux
          readelf -d target/release/retsurf | grep NEEDED
          newer=$(readelf -V target/release/retsurf \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV \
            | awk -F. -v f="${GLIBC_FLOOR#2.}" '$2 > f' | tr '\n' ' ')
          if [ -n "$newer" ]; then
            echo "binary requires $newer; the floor is GLIBC_$GLIBC_FLOOR" >&2
            exit 1
          fi
          # The C++ runtime carries no GLIBC_ version for the check above to catch.
          if readelf -d target/release/retsurf | grep -q 'NEEDED.*libstdc++'; then
            echo "binary links libstdc++ dynamically; it has to be static here" >&2
            exit 1
          fi

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsurf dist/retsurf-linux-aarch64
          strip dist/retsurf-linux-aarch64 || true
          ls -la dist/

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-linux-aarch64
          path: dist/retsurf-linux-aarch64
          retention-days: 14

      - name: Zip for release
        if: github.event_name == 'release'
        run: |
          set -eux
          cd dist && zip ../retsurf-linux-aarch64.zip retsurf-linux-aarch64
          cd ..
          # Checksum sidecar the in-app updater verifies against (src/update).
          sha256sum retsurf-linux-aarch64.zip > retsurf-linux-aarch64.zip.sha256

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            retsurf-linux-aarch64.zip
            retsurf-linux-aarch64.zip.sha256
