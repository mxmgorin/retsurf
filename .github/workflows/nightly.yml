name: Nightly

# One rolling pre-release on the `nightly` tag, rebuilt from main once a day.
# Release assets are public, so the app's nightly channel needs no GitHub token —
# Actions artifacts, which the channel used to read, require auth even here.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this commit is already the nightly or has not passed Check"
        type: boolean
        default: false
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: write
  actions: read

# Never two at once: they would race for the tag.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  changed:
    # Forks must not publish nightlies.
    if: github.repository == 'mxmgorin/retsurf'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Must match build.rs's nightly version.
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          echo "version=$crate-nightly.$(git show -s --format=%cd --date=format:%Y%m%d HEAD)" >> "$GITHUB_OUTPUT"
          # The published nightly records the commit it was built from, so a quiet
          # day costs nothing. No release yet means there is nothing to compare to.
          last="$(gh release view nightly --json body --jq .body 2>/dev/null \
                  | sed -n 's/^commit: //p' || true)"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced: rebuilding $sha"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$sha" = "$last" ]; then
            echo "no commits since the last nightly ($last)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            # A red or unfinished Check waits for a green commit on a later night.
            check="$(gh run list --workflow check.yml --commit "$sha" --event push \
                     --json conclusion --jq '.[0].conclusion // ""')"
            if [ "$check" = "success" ]; then
              echo "building $sha (last was ${last:-none})"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "skipping $sha: Check is '${check:-not finished}'"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  linux:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-linux.yml

  linux-arm:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-linux-arm.yml

  linux-armhf:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-linux-armhf.yml

  macos:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-macos.yml

  windows:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-windows.yml

  android:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    uses: ./.github/workflows/build-android.yml
    # The signing key, so a nightly APK installs over the one already there.
    secrets: inherit

  publish:
    needs: [changed, linux, linux-arm, linux-armhf, macos, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: art

      # Asset names must match the release ones exactly: the updater asks for a
      # file by name. Some artifacts are already the finished asset, the rest are
      # the tree or binary the release step would have zipped.
      - name: Package
        run: |
          set -eux
          mkdir -p out
          cp art/retsurf-allium/retsurf-allium.zip out/
          cp art/retsurf-onionos/retsurf-onionos.zip out/
          cp art/retsurf-spruceos-armhf/retsurf-spruceos-armhf.zip out/
          cp art/retsurf-macos-aarch64/*.dmg out/retsurf-macos-aarch64.dmg
          cp art/retsurf-android-arm64/*.apk out/retsurf-android-arm64.apk
          for a in retsurf-linux-x86_64 retsurf-linux-aarch64 retsurf-portmaster \
                   retsurf-spruceos-aarch64 retsurf-windows-x86_64; do
            (cd "art/$a" && zip -r "../../out/$a.zip" .)
          done
          # Sidecars for the three the updater installs in place; it verifies the
          # download against them (src/update).
          cd out
          for a in retsurf-linux-x86_64 retsurf-linux-aarch64 retsurf-portmaster; do
            sha256sum "$a.zip" > "$a.zip.sha256"
          done
          ls -la

      # The tag follows main rather than accumulating one tag per night.
      - name: Move the nightly tag
        run: |
          set -eux
          git tag -f nightly "${{ needs.changed.outputs.sha }}"
          git push origin nightly --force

      # The releases page orders by when a release was created, which neither an
      # edit nor a republish changes; a fresh release keeps the nightly on top.
      - name: Drop the previous nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes || true

      # prerelease + make_latest keep this out of the way of the stable channel,
      # which picks the highest semver tag and cannot parse `nightly` anyway.
      # Drafted until every asset is up, so the updater never sees half a release.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: v${{ needs.changed.outputs.version }}
          draft: true
          prerelease: true
          make_latest: false
          files: out/*
          body: |
            Untested automated build from the latest commit on main.

            commit: ${{ needs.changed.outputs.sha }}

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit nightly --draft=false
