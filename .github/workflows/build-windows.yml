name: Windows

on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [published]

# A release or a nightly run must never lose its artifacts to a newer commit, so
# only a manual re-run supersedes anything.
# Named by hand: `github.workflow` is the *caller's* name in a called workflow,
# so six callees would share one group and cancel each other out of it.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Servo's dependency tree nests deep enough to blow past MAX_PATH.
      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'release'
        uses: ./.github/actions/verify-version

      - name: Rust toolchain
        run: |
          rustup show
          rustc --version

      # The engine is a git dependency (our Servo fork), so a cold runner clones
      # ~1.7 GB before it can resolve. Cargo home only: a Servo release target/
      # would blow the 10 GB cache budget. `shared-key` shares one entry per OS.
      - name: Cache cargo home
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: cargo-home

      # SDL2 is built from source and linked statically (no system SDL2 on the
      # runner, and users shouldn't need a DLL either). SpiderMonkey comes as
      # mozjs' prebuilt archive for x86_64-pc-windows-msvc (jit+intl on, so its
      # build script downloads instead of compiling — no MozTools needed).
      # Default features stay on: desktop GL has working surfman, so webgl
      # keeps its connection probe.
      # CMAKE_POLICY_VERSION_MINIMUM: the SDL2 bundled in sdl2-sys declares
      # cmake_minimum_required < 3.5, which CMake 4.x refuses outright.
      - name: Build
        run: cargo build --release --features sdl2-bundled,sdl2-static-link
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # CI performance build (see Cargo.toml [profile.release] note); kept out
          # of Cargo.toml so local release builds stay fast to compile.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

      - name: Stage binary
        shell: bash
        run: |
          set -eux
          mkdir -p dist
          cp target/release/retsurf.exe dist/
          ls -la dist/

      # Upload the raw binary; upload-artifact archives it into a single zip.
      # (Pre-zipping here would produce a zip-inside-a-zip on download.)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-windows-x86_64
          path: dist/retsurf.exe
          retention-days: 14

      - name: Zip for release
        if: github.event_name == 'release'
        shell: bash
        run: cd dist && 7z a ../retsurf-windows-x86_64.zip .

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: retsurf-windows-x86_64.zip
