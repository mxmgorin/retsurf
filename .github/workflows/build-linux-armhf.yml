name: Linux ARMhf

# The Miyoo Mini (SSD202D, armv7) build. Its own workflow rather than a job in
# `Linux ARM`: that one runs natively on arm64 runners and this one
# cross-compiles from x86_64, so they share no runner, no cache and no wall
# clock. Nothing here can slow the aarch64 build down.
#
# Three artifacts: the bare binary, and the Allium and OnionOS card layouts
# around it — the same binary in both.
#
# Kept in step with tools/armhf/, which builds the same thing locally; the
# reasoning behind the toolchain choice lives in that Dockerfile.

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  TARGET: armv7-unknown-linux-gnueabihf
  LIBDIR: arm-linux-gnueabihf
  TOOLCHAIN: /opt/miyoomini-toolchain
  TOOLCHAIN_VERSION: v0.0.3
  # The oldest userland we target: OnionOS is glibc 2.28, which is also the
  # toolchain's own libc, so the floor holds by construction. Keep in step with
  # tools/armhf/glibc-floor.
  GLIBC_FLOOR: "2.28"
  # Debian bookworm, mirroring tools/armhf/Dockerfile.
  SDL_VERSION: "2.26.5+dfsg-1"
  FONTCONFIG_VERSION: "2.14.1-4"
  FREETYPE_VERSION: "2.12.1+dfsg-5+deb12u4"
  EXPAT_VERSION: "2.5.0-1+deb12u2"
  ZLIB_VERSION: "1.2.13.dfsg-1"
  LIBPNG_VERSION: "1.6.39-2+deb12u5"
  BROTLI_VERSION: "1.0.9-2+b6"
  # The sibling port whose package carries the Miyoo SDL2 build; the panel needs
  # its `Mini` video driver and no upstream SDL2 has one.
  RETSEND_VERSION: v0.8.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Host build tools
        run: |
          set -eux
          # Host-side only: Servo brings real C/C++, SpiderMonkey drives its own
          # configure/make (python3). The target libraries come from the two
          # sysroots below, not from apt.
          #
          # The target compiler is Ubuntu's cross GCC 10 — mozjs_sys 153 wants
          # GCC >= 10.1 and _GLIBCXX_RELEASE >= 10, where the Miyoo toolchain's
          # own GCC is 8.3. Not 12, also packaged: libstdc++ 12 references
          # `__libc_single_threaded`, a glibc 2.32 symbol absent from the 2.28
          # this device runs. The cross package brings the binutils the steps
          # after the build read the ELF with.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gperf pkg-config \
            gcc-10-arm-linux-gnueabihf g++-10-arm-linux-gnueabihf \
            python3 python3-pip python3-setuptools file
          arm-linux-gnueabihf-g++-10 --version | head -1

      - name: libclang 19 for bindgen
        run: |
          set -eux
          # Ubuntu stops at clang 15 and mozjs_sys 153 needs 19, the version
          # SpiderMonkey's configure names too. Its headers put a
          # `[[maybe_unused]]` after a GNU attribute (mfbt/Attributes.h hands GCC
          # and clang the same `__attribute__((format(printf, ...)))`), which
          # every clang up to 15 rejects: "an attribute list cannot appear here".
          # llvm-19 is here for llvm-objdump, which configure hunts for and
          # refuses to proceed without — it is what reads the test binary in the
          # static-libstdc++ detection.
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main" \
            | sudo tee /etc/apt/sources.list.d/llvm19.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-19-dev llvm-19
          ls /usr/lib/llvm-19/lib/libclang.so /usr/lib/llvm-19/bin/llvm-objdump

      - name: Rust toolchain
        run: |
          set -eux
          # rust-toolchain.toml pins the channel; rustup honors it.
          rustup target add "$TARGET"
          rustc --version

      - name: Miyoo Mini sysroot
        run: |
          set -eux
          # Downloaded for its sysroot alone: glibc 2.28, the OnionOS floor, so
          # the floor holds by construction rather than by asking for stubs. Its
          # bin/ deliberately stays off PATH — the GCC-8-era ar and readelf there
          # would answer for the cross names ahead of the ones matching the
          # compiler. See tools/armhf/Dockerfile.
          curl --retry 5 -fsSL \
            "https://github.com/shauninman/miyoomini-toolchain-buildroot/releases/download/$TOOLCHAIN_VERSION/miyoomini-toolchain.tar.xz" \
            | sudo tar -xJ -C /opt
          ls "$TOOLCHAIN/arm-linux-gnueabihf/libc/lib/libc.so.6"

      - name: Compiler shims
        run: |
          set -eux
          # Ubuntu's cross GCC carries no default FPU, and SpiderMonkey's
          # configure probes it with a bare `-march=armv7-a` of its own: that
          # resets the FPU choice, and armhf's default `-mfloat-abi=hard` then has
          # nothing to use ("cc1: error: selected processor lacks an FPU").
          # CFLAGS cannot reach that probe, so the A7's FPU goes on the driver.
          # Last wins, so this also settles the -mfpu cc-rs passes.
          sudo mkdir -p /opt/cc-shims
          for tool in gcc-10 g++-10; do
            printf '%s\n' '#!/bin/sh' \
              "exec /usr/bin/arm-linux-gnueabihf-$tool \"\$@\" -mfpu=neon-vfpv4" \
              | sudo tee "/opt/cc-shims/arm-linux-gnueabihf-$tool" >/dev/null
            sudo chmod 755 "/opt/cc-shims/arm-linux-gnueabihf-$tool"
          done
          echo "/opt/cc-shims" >> "$GITHUB_PATH"
          # `-static-libstdc++` only replaces the driver's own `-lstdc++`, and
          # cc-rs puts another one on the link line for every C++ crate in the
          # graph, which finds a shared library and pulls it back in. A directory
          # holding only the archive answers that one statically too.
          sudo mkdir -p /opt/cxx-static
          sudo ln -s /usr/lib/gcc-cross/arm-linux-gnueabihf/10/libstdc++.a \
            /opt/cxx-static/libstdc++.a

      - name: armhf sysroot
        run: |
          set -eux
          # SDL2 and fontconfig for the link step; the toolchain's sysroot
          # carries the device's own libraries but neither of these. Only their
          # symbols matter — the device loads its own SDL2, and fontconfig ships
          # in the app. Ubuntu's SDL2 is 2.0.20, which predates
          # SDL_RenderGeometry, the call the software renderer draws through, so
          # take Debian's.
          #
          # zlib is here for its headers too: freetype-sys builds libpng, which
          # includes <zlib.h>, and it never looks at libz-sys's vendored copy
          # (build.rs hardcodes a relative path that does not exist in the
          # published crate). On a host build the system header covers that up.
          #
          # libpng and brotli are neither linked nor included — they are here
          # because pkg-config refuses to answer for fontconfig until every .pc
          # in the chain resolves, and Debian's freetype2.pc names them under
          # Requires.private. The probe at the end is that same question, asked
          # before the build rather than twenty minutes into it.
          pool=http://deb.debian.org/debian/pool/main
          sudo mkdir -p /opt/sysroot
          cd "$(mktemp -d)"
          for deb in \
            "libs/libsdl2/libsdl2-2.0-0_${SDL_VERSION}_armhf.deb" \
            "libs/libsdl2/libsdl2-dev_${SDL_VERSION}_armhf.deb" \
            "f/fontconfig/libfontconfig1_${FONTCONFIG_VERSION}_armhf.deb" \
            "f/fontconfig/libfontconfig-dev_${FONTCONFIG_VERSION}_armhf.deb" \
            "f/freetype/libfreetype6_${FREETYPE_VERSION}_armhf.deb" \
            "f/freetype/libfreetype-dev_${FREETYPE_VERSION}_armhf.deb" \
            "e/expat/libexpat1_${EXPAT_VERSION}_armhf.deb" \
            "e/expat/libexpat1-dev_${EXPAT_VERSION}_armhf.deb" \
            "z/zlib/zlib1g_${ZLIB_VERSION}_armhf.deb" \
            "z/zlib/zlib1g-dev_${ZLIB_VERSION}_armhf.deb" \
            "libp/libpng1.6/libpng16-16_${LIBPNG_VERSION}_armhf.deb" \
            "libp/libpng1.6/libpng-dev_${LIBPNG_VERSION}_armhf.deb" \
            "b/brotli/libbrotli1_${BROTLI_VERSION}_armhf.deb" \
            "b/brotli/libbrotli-dev_${BROTLI_VERSION}_armhf.deb" \
          ; do
            curl --retry 5 -fsSLO "$pool/$deb"
            sudo dpkg -x "$(basename "$deb")" /opt/sysroot
          done
          PKG_CONFIG_LIBDIR="/opt/sysroot/usr/lib/$LIBDIR/pkgconfig" \
            PKG_CONFIG_SYSROOT_DIR=/opt/sysroot \
            pkg-config --libs --cflags fontconfig sdl2

      # The engine is a git dependency (our Servo fork), so a cold runner clones
      # ~1.7 GB before it can resolve. Cargo home only: a Servo release target/
      # would blow the 10 GB cache budget. Its own `shared-key`, separate from
      # the aarch64 workflow's — one entry per architecture, so neither evicts
      # the other.
      - name: Cache cargo home
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: cargo-home-armhf

      - name: Build
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc-10
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++-10
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc-10
          # The SSD202D is always a Cortex-A7. On the Rust side +neon is not
          # redundant with target-cpu: the target spec disables NEON outright and
          # target-cpu does not undo that (verified in the emitted asm), so
          # dropping it silently costs vectorisation. It warns about being
          # unstable, once per crate.
          # --allow-shlib-undefined: this SDL2 pulls in X11/wayland/alsa/gbm,
          # which neither sysroot has and we never call.
          #
          # The link takes libc from the device's sysroot and libstdc++ from the
          # compiler, which is what makes this arrangement work: only
          # $SYSROOT/usr/lib goes on the search path, never $SYSROOT/lib — that
          # one also holds the toolchain's libstdc++ 8.3, and finding it first
          # would answer -static-libstdc++ with a runtime older than the headers.
          # /opt/cxx-static holds only the archive, which is what makes cc-rs's
          # own -lstdc++ static too. libgcc_s stays dynamic: its symbols are
          # GCC_3.0 to GCC_4.3.0, frozen for two decades.
          # -lpthread by hand: glibc folded it into libc in 2.34, so the compiler
          # no longer passes it, and libstdc++'s <thread> needs it on 2.28.
          #
          # The binary's own text is demand-paged off the SD card, and the device
          # took 191k major faults in one session reading it back:
          #   -Wl,--gc-sections drops what the C/C++ halves never reference;
          #   relocation-model=static skips a PIE's relocation work at launch.
          # -B$SYSROOT/usr/lib is load-bearing, not an optimisation: it makes gcc
          # take crt1.o and libc_nonshared.a from the glibc-2.28 sysroot. Ubuntu's
          # GCC 10 defaults them to its own glibc 2.35, where __libc_csu_init is
          # gone and .init_array is the loader's job (needs glibc >= 2.34). On the
          # device's 2.28 neither path then runs .init_array, so every C++ global
          # constructor is skipped -- SpiderMonkey spins forever on an
          # unconstructed static. --sysroot does not redirect the crt gcc
          # auto-adds; -B does.
          RUSTFLAGS: >-
            -L /opt/sysroot/usr/lib/arm-linux-gnueabihf
            -C link-arg=--sysroot=/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc
            -C link-arg=-L/opt/cxx-static
            -C link-arg=-L/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc/usr/lib
            -C link-arg=-static-libstdc++ -C link-arg=-static-libgcc
            -C link-arg=-lpthread
            -C link-arg=-Wl,--allow-shlib-undefined
            -C link-arg=-Wl,--gc-sections
            -C relocation-model=static -C link-arg=-no-pie
            -C link-arg=-B/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc/usr/lib
            -C target-cpu=cortex-a7 -C target-feature=+neon
          # -mtune, never -mcpu: cc-rs passes -march=armv7-a of its own, and GCC
          # warns that -mcpu conflicts with it. That warning is fatal in a way
          # that looks like nothing — cc-rs reads any stderr from a flag probe as
          # "unsupported", so one warning makes it drop every flag_if_supported
          # flag in the graph. mozjs_sys asks for -fno-rtti and
          # -fno-sized-deallocation that way: the first breaks the link against
          # SpiderMonkey's own no-rtti build, the second is a silent ABI mismatch
          # on operator delete.
          # No -mfpu here: the driver shim appends it after everything, which is
          # what also settles the vfpv3-d16 cc-rs passes (no NEON, and swgl
          # without NEON falls back to scalar).
          # -I: the Debian sysroot headers (zlib for libpng, see above).
          # --sysroot: the compiler is Ubuntu's, the userland the device's.
          # Without it both halves compile against jammy's glibc 2.35 headers and
          # the link resolves there, taking the binary over the floor.
          CFLAGS_armv7_unknown_linux_gnueabihf: "--sysroot=/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc -mtune=cortex-a7 -I/opt/sysroot/usr/include"
          CXXFLAGS_armv7_unknown_linux_gnueabihf: "--sysroot=/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc -mtune=cortex-a7 -I/opt/sysroot/usr/include"
          # bindgen runs libclang against target headers, so it needs pointing at
          # both sysroots by hand — it inherits nothing from the cross gcc. The
          # C++ headers are the compiler's, not the sysroot's: that one carries
          # libstdc++ 8.3 headers and SpiderMonkey requires 10 or newer.
          LIBCLANG_PATH: /usr/lib/llvm-19/lib
          CLANG_PATH: /usr/bin/clang-19
          BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_gnueabihf: >-
            --target=armv7-unknown-linux-gnueabihf
            --sysroot=/opt/miyoomini-toolchain/arm-linux-gnueabihf/libc
            -isystem /usr/arm-linux-gnueabihf/include/c++/10
            -isystem /usr/arm-linux-gnueabihf/include/c++/10/arm-linux-gnueabihf
            -isystem /usr/lib/gcc-cross/arm-linux-gnueabihf/10/include
            -isystem /opt/miyoomini-toolchain/arm-linux-gnueabihf/include
            -isystem /opt/sysroot/usr/include
          # SpiderMonkey's configure hunts for llvm-objdump beside whichever clang
          # it found and gives up if there is none. Named outright, since the
          # compiler here is GCC.
          LLVM_OBJDUMP: /usr/lib/llvm-19/bin/llvm-objdump
          # SpiderMonkey builds tools that run on the build machine, and its
          # configure falls back to the target compiler when these are unset. GCC
          # and not the clang beside it: 153 wants clang 19 or newer for a
          # compiler, and the host GCC is 11, above its 10.1 floor.
          HOST_CC: gcc
          HOST_CXX: g++
          # Only fontconfig is probed; everything else in the graph builds from
          # source once the probe fails, which is why the sysroot carries so little.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_SYSROOT_DIR: /opt/sysroot
          PKG_CONFIG_LIBDIR: /opt/sysroot/usr/lib/arm-linux-gnueabihf/pkgconfig
          # CI performance build, kept out of Cargo.toml so local release builds
          # stay fast to compile. Size over speed for the bulk of the Rust: the
          # engine's code is cold and there is a lot of it, and the binary is
          # paged off the same card as the swap. The rasterizers keep -O3, see
          # Cargo.toml.
          CARGO_PROFILE_RELEASE_LTO: "fat"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
          # webgl off, so the surfman probe — our only catch_unwind — is gone and
          # unwind tables with it. Same trade as the aarch64 handheld build.
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: |
          set -eux
          cargo build --release --no-default-features --features software --target "$TARGET"
          df -h /

      - name: Stage binary
        run: |
          set -eux
          mkdir -p dist
          cp "target/$TARGET/release/retsurf" dist/retsurf-linux-armhf
          arm-linux-gnueabihf-strip dist/retsurf-linux-armhf
          file dist/retsurf-linux-armhf
          arm-linux-gnueabihf-readelf -d dist/retsurf-linux-armhf | grep NEEDED
          ls -la dist/

      - name: Check the glibc floor
        run: |
          set -eux
          # Above the floor the loader refuses the binary on the device. Fail
          # here instead of there.
          arm-linux-gnueabihf-readelf -V dist/retsurf-linux-armhf \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV
          newer=$(arm-linux-gnueabihf-readelf -V dist/retsurf-linux-armhf \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV \
            | awk -F. -v f="${GLIBC_FLOOR#2.}" '$2 > f' | tr '\n' ' ')
          if [ -n "$newer" ]; then
            echo "binary requires $newer; the floor is GLIBC_$GLIBC_FLOOR" >&2
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-linux-armhf
          path: dist/retsurf-linux-armhf

      - name: Packaging inputs
        run: |
          set -eux
          # Fonts for the package: core has the uprights, extra the oblique and
          # italic that `fonts.conf.in` maps onto the generic families.
          sudo apt-get install -y --no-install-recommends \
            unzip fonts-dejavu-core fonts-dejavu-extra
          curl --retry 5 -fsSLO \
            "https://github.com/mxmgorin/retsend/releases/download/$RETSEND_VERSION/retsend-allium.zip"
          sudo unzip -q retsend-allium.zip -d /opt/retsend
          ls /opt/retsend/Apps/Retsend.pak/lib

      # The same script that packages locally, minus its container: the toolchain
      # and the trust store are already on this runner, so it takes the runtime
      # libraries the direct way (tools/armhf/runtime-libs.sh). Both card layouts
      # in one run, over one copy of the payload they share.
      - name: Package for Allium and OnionOS
        env:
          RETSURF_NO_DOCKER: "1"
          RETSURF_ARM_BIN: ${{ github.workspace }}/dist/retsurf-linux-armhf
          RETSURF_SDL_LIB: /opt/retsend/Apps/Retsend.pak/lib
          RETSURF_FONTS_DIR: /usr/share/fonts/truetype/dejavu
        run: tools/armhf/package-miyoo.sh -n

      - name: Upload the Allium package
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-allium
          path: dist/retsurf-allium.zip

      - name: Upload the OnionOS package
        uses: actions/upload-artifact@v4
        with:
          name: retsurf-onionos
          path: dist/retsurf-onionos.zip
